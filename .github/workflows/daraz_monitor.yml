name: Daraz monitor

on:
  workflow_dispatch:

#   Enable after one successful manual run:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours UTC

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daraz monitor
        env:
          # ── Auth ────────────────────────────────────────────────
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "120"

          # ── Environment ─────────────────────────────────────────
          ENV: production
          DEBUG: "False"

          # ── Database (required by Settings) ─────────────────────
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL_NEON: ${{ secrets.DATABASE_URL_NEON }}

          # ── External APIs (required) ────────────────────────────
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # ── IPRoyal (required by Settings even if USE_PROXY=False)
          IPROYAL_USERNAME: ${{ secrets.IPROYAL_USERNAME }}
          IPROYAL_PASSWORD: ${{ secrets.IPROYAL_PASSWORD }}
          IPROYAL_HOST: ${{ secrets.IPROYAL_HOST }}
          IPROYAL_SOCKS5_PORT: ${{ secrets.IPROYAL_SOCKS5_PORT }}
          IPROYAL_COUNTRY: ${{ secrets.IPROYAL_COUNTRY }}
          IPROYAL_SESSION_LIFETIME: ${{ secrets.IPROYAL_SESSION_LIFETIME }}
          IPROYAL_SESSION_COUNT: ${{ secrets.IPROYAL_SESSION_COUNT }}
          PROXY_PROTOCOL: ${{ secrets.PROXY_PROTOCOL }}
          USE_PROXY: ${{ secrets.USE_PROXY }}

          # ── Alerts ──────────────────────────────────────────────
          PRICE_CHANGE_THRESHOLD_PCT: ${{ secrets.PRICE_CHANGE_THRESHOLD_PCT }}

        run: python main_daraz.py --mode monitor